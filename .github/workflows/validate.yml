name: Validate
on:
  pull_request:
  push:
    branches:
      - main
      - feature/painel-monitoramento-transparente
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check PHP syntax
        run: |
          find backend -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check backend/public/app.js
          node --check backend/public/login.js
